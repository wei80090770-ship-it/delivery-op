<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>外送中心｜實際 TC 分析</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>:root{font-family:Arial,"Microsoft JhengHei",sans-serif;color:#18243b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:22px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}.muted{color:#64748b;font-size:13px}.panel{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:14px 0}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-size:13px;display:flex;flex-direction:column;gap:5px}select,input,button{border:1px solid #cbd5e1;border-radius:7px;padding:9px;background:white;color:#18243b}button{cursor:pointer;background:#1e40af;color:white;border:0}button.secondary{background:#e9eef7;color:#1e3a8a}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tabs button{background:#e8edf5;color:#334155}.tabs button.active{background:#1e40af;color:white}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.kpi{border:1px solid #e2e8f0;border-radius:9px;padding:15px}.kpi strong{display:block;font-size:25px;margin:8px 0}.up{color:#047857}.down{color:#b91c1c}.scroll{overflow:auto;max-height:570px}table{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}td,th{padding:8px 10px;border-bottom:1px solid #e2e8f0;border-right:1px solid #edf2f7;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#e9effa;z-index:2}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:white;z-index:1}th:first-child{z-index:3;background:#e9effa}tr:hover td{background:#f1f5ff}#status{white-space:pre-wrap} .warning{color:#b45309}.small{font-size:12px} .hide{display:none}</style></head>
<body><main class="wrap"><h1>實際 TC｜外送中心分析看板</h1><p class="muted">BI 歷史資料匯入｜預計送達時間為預設統計基準｜所有訂單狀態均納入（含取消）</p>
<section class="panel"><h2>資料匯入與日期涵蓋</h2><div class="filters"><label>BI Excel（可多次補匯）<input id="files" type="file" accept=".xlsx,.xls" multiple></label><button id="import">匯入並合併</button><button class="secondary" id="export">備份統計資料</button><label>還原備份<input id="restore" type="file" accept=".json"></label><button class="secondary" id="clear">清除本機資料</button></div><p class="muted">此獨立版本將去重後的「日期 × 中心 × 餐廳 × 30 分鐘」統計儲存於本瀏覽器 IndexedDB，不會自動同步 Supabase。跨電腦請使用備份／還原；正式多人共用需再部署資料庫寫入介面。</p><div id="status" class="muted">準備就緒</div><div id="coverage" class="muted"></div></section>
<section class="panel"><div class="tabs" id="tabs"><button data-tab="week" class="active">週分析</button><button data-tab="month">月分析</button><button data-tab="weekday">星期分析</button><button data-tab="holiday">節日／自訂日期</button><button data-tab="half">餐廳 × 30分鐘 TC</button><button data-tab="dates">資料庫日期</button></div><div class="filters" style="margin-top:15px">
<label>中心<select id="center"><option value="">全市場</option></select></label><label>餐廳<select id="store"><option value="">全部餐廳</option></select></label><label>統計時間<select id="basis"><option value="promised">預計送達</option><option value="order">落單時間</option></select></label><label>開始日期<input id="start" type="date"></label><label>結束日期<input id="end" type="date"></label><label>指定星期<select id="day"><option value="">全部星期</option><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="0">星期日</option></select></label><button id="run">查詢分析</button><button class="secondary" id="csv">匯出目前表格 CSV</button></div><p id="hint" class="muted"></p></section>
<section class="panel"><div class="kpis" id="kpis"></div></section><section class="panel"><h2 id="resultTitle">分析結果</h2><p class="muted" id="note"></p><div class="scroll"><table id="result"></table></div></section>
</main><script>
const $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:1}), dateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dateStr(d)}, dayOf=s=>new Date(s+'T12:00:00').getDay(), mon=s=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dateStr(d)}, firstMonth=s=>s.slice(0,7)+'-01', lastMonth=s=>addDays(dateStr(new Date(Number(s.slice(0,4)),Number(s.slice(5,7)),1)), -1), shiftYear=s=>{let d=new Date(s+'T12:00:00');d.setFullYear(d.getFullYear()-1);return dateStr(d)};
let db,records=[],keys=new Set(),tab='week',shown=[];
function openDB(){return new Promise((ok,fail)=>{let r=indexedDB.open('tc_bi_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('orders',{keyPath:'key'});r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
function getAll(){return new Promise((ok,fail)=>{let t=db.transaction('orders','readonly'),r=t.objectStore('orders').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
function writeBatch(rows){return new Promise((ok,fail)=>{let t=db.transaction('orders','readwrite'),s=t.objectStore('orders');for(let r of rows)s.put(r);t.oncomplete=ok;t.onerror=()=>fail(t.error)})}
function parseDate(v){if(v instanceof Date)return isNaN(v)?null:v;if(typeof v==='number'){let x=XLSX.SSF.parse_date_code(v);return x?new Date(x.y,x.m-1,x.d,x.H,x.M,x.S):null}if(!v)return null;let s=String(v).trim().replace(/\//g,'-');let d=new Date(s.replace(' ','T'));return isNaN(d)?null:d}
function slot(d){return String(d.getHours()).padStart(2,'0')+':'+(d.getMinutes()<30?'00':'30')}
function identify(r){return String(r['訂購號碼']??r['訂單編號']??'').trim()}
function keyFor(r,o,p){let id=identify(r),ac=String(r['AC']||'').trim(),a=o?`${dateStr(o)}T${o.toTimeString().slice(0,8)}`:'',b=p?`${dateStr(p)}T${p.toTimeString().slice(0,8)}`:'';return [ac,id,a,b].join('|')}
async function importFiles(){let files=[...$('files').files];if(!files.length)return alert('請先選擇 Excel');$('import').disabled=true;let added=0,duplicate=0,invalid=0;try{for(let f of files){$('status').textContent=`讀取 ${f.name}…（大型 BI 檔案可能需要一段時間）`;await new Promise(r=>setTimeout(r,40));let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});for(let sheet of wb.SheetNames){let ws=wb.Sheets[sheet],rows=XLSX.utils.sheet_to_json(ws,{defval:''}),batch=[];for(let r of rows){let o=parseDate(r['落單時間']),p=parseDate(r['預計送達']??r['原預計送達時間']);if(!o&&!p){invalid++;continue}let key=keyFor(r,o,p);if(keys.has(key)){duplicate++;continue}keys.add(key);batch.push({key,center:String(r['RC']||'未分類').trim(),ac:String(r['AC']||'').trim(),store:String(r['ID']||'未分類').trim(),order:o?dateStr(o):'',orderSlot:o?slot(o):'',promised:p?dateStr(p):'',promisedSlot:p?slot(p):'',status:String(r['訂單狀態']||'')});added++;if(batch.length>=2000){await writeBatch(batch);batch=[];$('status').textContent=`${f.name}：已處理新增 ${fmt(added)} 筆…`;await new Promise(r=>setTimeout(r,0))}}if(batch.length)await writeBatch(batch)}}$('status').textContent=`匯入完成：新增 ${fmt(added)} 筆，跳過重複 ${fmt(duplicate)} 筆，無有效時間 ${fmt(invalid)} 筆。所有訂單狀態均保留。`;await refresh()}catch(e){$('status').textContent='匯入失敗：'+e.message;await refresh()}finally{$('import').disabled=false}}
function scope(r){return (!$('center').value||r.center===$('center').value)&&(!$('store').value||r.store===$('store').value)}
function getDate(r){return $('basis').value==='promised'?r.promised:r.order}function getSlot(r){return $('basis').value==='promised'?r.promisedSlot:r.orderSlot}
function filtered(s,e,weekday=''){return records.filter(r=>scope(r)&&getDate(r)&&getDate(r)>=s&&getDate(r)<=e&&(!weekday||String(dayOf(getDate(r)))===weekday))}
function aggregate(rows,fn){let m=new Map();for(let r of rows){let k=fn(r);m.set(k,(m.get(k)||0)+1)}return m}
function compare(a,b){return b?((a/b-1)*100).toFixed(1)+'%':'—'}
function showKpis(a,b,daysA,daysB){let cards=[['本期 TC',fmt(a.length),'含所有訂單狀態'],['比較期 TC',fmt(b.length),'依分析模式'],['TC 差異',fmt(a.length-b.length),compare(a.length,b.length)],['本期日均 TC',fmt(a.length/(daysA||1)),'依涵蓋日期'],['比較期日均 TC',fmt(b.length/(daysB||1)),'依涵蓋日期']];$('kpis').innerHTML=cards.map(x=>`<div class="kpi"><span class="muted">${x[0]}</span><strong>${x[1]}</strong><span class="muted">${x[2]}</span></div>`).join('')}
function table(headers,rows){shown=[headers,...rows];$('result').innerHTML='<thead><tr>'+headers.map(h=>`<th>${escapeHTML(h)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>`<td>${escapeHTML(String(v))}</td>`).join('')+'</tr>').join('')+'</tbody>'}
function escapeHTML(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function distinctDays(a){return new Set(a.map(getDate)).size}
function analyze(){let s=$('start').value,e=$('end').value,w=$('day').value;if(!s||!e||s>e)return alert('請設定有效日期區間');let ps,pe;if(tab==='week'){ps=addDays(s,-7);pe=addDays(e,-7)}else if(tab==='month'||tab==='holiday'){ps=shiftYear(s);pe=shiftYear(e)}else{ps=addDays(s,-7);pe=addDays(e,-7)}
let a=filtered(s,e,w),b=filtered(ps,pe,w);showKpis(a,b,distinctDays(a),distinctDays(b));$('hint').textContent=`本期 ${s}～${e}｜比較期 ${ps}～${pe}｜時間基準：${$('basis').selectedOptions[0].textContent}`;let mapA,mapB,labels;
if(tab==='dates'){let dates=aggregate(a,getDate);let arr=[];for(let d=s;d<=e;d=addDays(d,1)){arr.push([d,'日一二三四五六'[dayOf(d)],dates.get(d)||0,dates.has(d)?'有資料':'無資料／未營業（待核對）'])}table(['日期','星期','TC','資料狀態'],arr);$('resultTitle').textContent='資料庫日期狀態';$('note').textContent='「無資料」不能直接判定為未匯入；可能是未營業。請與 BI 匯出範圍核對。';return}
if(tab==='half'){mapA=aggregate(a,r=>r.store+'|'+getSlot(r));mapB=aggregate(b,r=>r.store+'|'+getSlot(r));let slots=[...new Set([...a,...b].map(getSlot).filter(Boolean))].sort(),stores=[...new Set([...a,...b].map(r=>r.store))].sort();let arr=stores.map(store=>[store,...slots.map(t=>mapA.get(store+'|'+t)||0),...slots.map(t=>mapB.get(store+'|'+t)||0),a.filter(r=>r.store===store).length]);table(['餐廳',...slots.map(x=>x+' 本期'),...slots.map(x=>x+' 比較期'),'本期合計'],arr);$('resultTitle').textContent='餐廳 × 30分鐘 TC';$('note').textContent='橫向時段依所選時間基準。含所有訂單狀態；本期與比較期各自彙總。';return}
if(tab==='weekday'){mapA=aggregate(a,r=>String(dayOf(getDate(r))));mapB=aggregate(b,r=>String(dayOf(getDate(r))));labels=[1,2,3,4,5,6,0].map(n=>String(n));}else{mapA=aggregate(a,r=>getDate(r));mapB=aggregate(b,r=>tab==='week'?addDays(getDate(r),7):shiftYear(getDate(r)).replace(/$/,''));labels=[...new Set([...mapA.keys(),...mapB.keys()])].sort()}
let rows=labels.map(k=>{let x=mapA.get(k)||0,y=mapB.get(k)||0;return [tab==='weekday'?('日一二三四五六'[Number(k)]):k,x,y,x-y,compare(x,y)]});table([tab==='weekday'?'星期':'日期','本期 TC','比較期 TC','差異','成長率'],rows);$('resultTitle').textContent=tab==='week'?'週 TC 比較':tab==='month'?'月 TC 去年同期比較':tab==='holiday'?'節日／自訂日期比較':'星期別 TC 比較';$('note').textContent='月分析以去年相同日期區間為比較期；星期分析的總量會受各星期出現次數影響，請搭配日均 TC 判讀。'}
async function refresh(){records=await getAll();keys=new Set(records.map(r=>r.key));let centers=[...new Set(records.map(r=>r.center))].sort(),old=$('center').value;$('center').innerHTML='<option value="">全市場</option>'+centers.map(c=>`<option>${escapeHTML(c)}</option>`).join('');$('center').value=old;updateStores();let dates=records.map(r=>r.promised).filter(Boolean).sort(),unique=new Set(dates);$('coverage').textContent=dates.length?`已儲存 ${fmt(records.length)} 筆去重訂單｜預計送達資料：${dates[0]} ～ ${dates.at(-1)}｜有資料 ${fmt(unique.size)} 天｜${centers.length} 個中心`:'尚無資料。';if(dates.length&&!$('end').value){let max=dates.at(-1);$('end').value=max;$('start').value=addDays(max,-6);setDefaults()}analyzeIfReady()}
function updateStores(){let c=$('center').value,old=$('store').value,stores=[...new Set(records.filter(r=>!c||r.center===c).map(r=>r.store))].sort();$('store').innerHTML='<option value="">全部餐廳</option>'+stores.map(s=>`<option>${escapeHTML(s)}</option>`).join('');$('store').value=old}
function setDefaults(){let end=$('end').value||dateStr(new Date());if(tab==='week'){let monday=mon(end);$('start').value=addDays(monday,-7);$('end').value=addDays(monday,-1)}else if(tab==='month'){let first=firstMonth(end);$('start').value=firstMonth(addDays(first,-1));$('end').value=addDays(first,-1)}}
function analyzeIfReady(){if($('start').value&&$('end').value)analyze()}
$('import').onclick=importFiles;$('run').onclick=analyze;$('center').onchange=()=>{updateStores();analyzeIfReady()};$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(tab==='week'||tab==='month')setDefaults();analyzeIfReady()};$('export').onclick=()=>download('TC_本機資料備份.json',JSON.stringify(records),'application/json');$('restore').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a))throw Error('備份格式不正確');for(let i=0;i<a.length;i+=1000)await writeBatch(a.slice(i,i+1000));await refresh();$('status').textContent='備份還原完成'}catch(x){alert(x.message)}};$('clear').onclick=async()=>{if(!confirm('確定清除本瀏覽器所有 TC 訂單資料？請先備份。'))return;await new Promise((ok,fail)=>{let t=db.transaction('orders','readwrite');t.objectStore('orders').clear();t.oncomplete=ok;t.onerror=()=>fail(t.error)});$('start').value='';$('end').value='';await refresh()};$('csv').onclick=()=>download('TC_查詢結果.csv','\ufeff'+shown.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
openDB().then(x=>{db=x;return refresh()}).catch(e=>$('status').textContent='資料庫啟動失敗：'+e.message);
</script></body></html>
